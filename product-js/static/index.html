<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Google Ads MCP Demo</title>
    <style>
      :root { color-scheme: light; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
      label { display:block; font-size: 12px; color:#444; margin-bottom: 6px; }
      input, textarea, button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd; }
      textarea { width: min(900px, 100%); min-height: 96px; resize: vertical; }
      button { cursor: pointer; background: #0b57d0; color: #fff; border: 0; }
      pre { background:#0b1220; color:#d8e3ff; padding: 14px; border-radius: 14px; overflow:auto; }
      .card { border: 1px solid #eee; border-radius: 16px; padding: 14px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .muted { color:#666; font-size: 12px; }
      .status { margin-top: 10px; font-size: 12px; color:#555; }
    </style>
  </head>
  <body>
    <h1>Google Ads MCP Demo</h1>
    <p class="muted">Type a question. The backend creates an async job, stores the response document, and the page polls until the result is ready.</p>

    <div class="card">
      <div class="row" style="align-items:start;">
        <div style="flex: 1; min-width: 260px;">
          <label>Customer ID (optional default context)</label>
          <input id="customerId" placeholder="6475421500" style="width:min(420px, 100%);" />
          <div style="height: 10px;"></div>
          <label>Message</label>
          <textarea id="message" placeholder="Example: List my campaigns with name and status (limit 20)."></textarea>
          <div style="height: 10px;"></div>
          <button onclick="send()">Send</button>
          <div id="status" class="status">Idle.</div>
        </div>
      </div>
    </div>

    <h2 style="font-size:14px; margin-top:18px;">Output</h2>
    <pre id="out">Ready.</pre>

    <script>
      let activePoll = null;
      const CUSTOMER_ID_KEY = 'googleAdsDemo.customerId';
      const SESSION_ID_KEY = 'googleAdsDemo.sessionId';
      const FALLBACK_CUSTOMER_ID = '6475421500';

      function setStatus(text) {
        document.getElementById('status').textContent = text;
      }

      function getStoredCustomerId() {
        try {
          return localStorage.getItem(CUSTOMER_ID_KEY) || '';
        } catch {
          return '';
        }
      }

      function storeCustomerId(value) {
        try {
          if (value) {
            localStorage.setItem(CUSTOMER_ID_KEY, value);
          } else {
            localStorage.removeItem(CUSTOMER_ID_KEY);
          }
        } catch {
          // Ignore storage failures and continue without persistence.
        }
      }

      function getSessionId() {
        try {
          let sessionId = localStorage.getItem(SESSION_ID_KEY) || '';
          if (!sessionId && window.crypto?.randomUUID) {
            sessionId = window.crypto.randomUUID();
            localStorage.setItem(SESSION_ID_KEY, sessionId);
          }
          return sessionId;
        } catch {
          return '';
        }
      }

      function storeSessionId(value) {
        try {
          if (value) localStorage.setItem(SESSION_ID_KEY, value);
        } catch {
          // Ignore storage failures; the backend cookie fallback still keeps context.
        }
      }

      function effectiveCustomerId() {
        const typed = document.getElementById('customerId').value.trim();
        return typed || getStoredCustomerId() || FALLBACK_CUSTOMER_ID;
      }

      async function fetchJson(url, options) {
        const res = await fetch(url, options);
        const json = await res.json().catch(async () => ({ raw: await res.text() }));
        if (!res.ok) {
          throw new Error(json?.error || json?.raw || `Request failed with status ${res.status}`);
        }
        return json;
      }

      function stopPolling() {
        if (activePoll) {
          clearTimeout(activePoll);
          activePoll = null;
        }
      }

      async function pollJob(jobId) {
        const out = document.getElementById('out');
        try {
          const job = await fetchJson(`/api/chat/${jobId}`);
          if (job?.sessionId) storeSessionId(job.sessionId);
          const status = job?.status || 'unknown';
          setStatus(`Job ${jobId}: ${status}${job?.sessionId ? ` | Session ${job.sessionId}` : ''}`);
          if (status === 'completed') {
            out.textContent = job?.result?.text || job?.text || JSON.stringify(job, null, 2);
          } else if (status === 'failed') {
            out.textContent = job?.error || JSON.stringify(job, null, 2);
          } else {
            out.textContent = JSON.stringify(job, null, 2);
          }

          if (status === 'completed' || status === 'failed') {
            stopPolling();
            return;
          }

          activePoll = setTimeout(() => pollJob(jobId), 1500);
        } catch (e) {
          stopPolling();
          setStatus('Polling failed.');
          out.textContent = String(e);
        }
      }

      async function send() {
        const out = document.getElementById('out');
        stopPolling();
        out.textContent = 'Submitting job...';
        setStatus('Creating async job...');

        const customerId = effectiveCustomerId();
        const sessionId = getSessionId();
        const message = document.getElementById('message').value.trim();
        if (!message) {
          out.textContent = 'Message is required.';
          setStatus('Idle.');
          return;
        }

        storeCustomerId(customerId);
        document.getElementById('customerId').value = customerId;

        try {
          const response = await fetchJson('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, customerId, sessionId })
          });
          if (response?.sessionId) storeSessionId(response.sessionId);
          if (response?.status === 'completed') {
            out.textContent = response?.text || response?.result?.text || JSON.stringify(response, null, 2);
            setStatus(`Completed without polling.${response?.sessionId ? ` Session ${response.sessionId}.` : ''}`);
            return;
          }

          if (response?.status === 'failed') {
            out.textContent = response?.error || JSON.stringify(response, null, 2);
            setStatus('Request failed.');
            return;
          }

          out.textContent = JSON.stringify(response, null, 2);
          setStatus(`Job ${response.jobId}: ${response.status}${response?.sessionId ? ` | Session ${response.sessionId}` : ''}`);
          await pollJob(response.jobId);
        } catch (e) {
          stopPolling();
          setStatus('Request failed.');
          out.textContent = String(e);
        }
      }

      (function initCustomerId() {
        const initial = getStoredCustomerId() || FALLBACK_CUSTOMER_ID;
        const sessionId = getSessionId();
        document.getElementById('customerId').value = initial;
        setStatus(`Using default customer id ${initial}.${sessionId ? ` Session ${sessionId}.` : ''}`);
      })();
    </script>
  </body>
</html>
